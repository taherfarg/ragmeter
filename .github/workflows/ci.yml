name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,api]"
      - run: pytest -q

  gate:
    # A separate job so a retrieval regression is distinguishable at a glance
    # from a broken test, and so it still runs when the tests are unrelated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Fetch the corpus
        run: |
          mkdir -p data
          curl -sSL -o data/squad-dev-v1.1.json \
            https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v1.1.json

      - name: Regression gate
        run: bash scripts/gate.sh
