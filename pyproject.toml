[project]
name = "ragmeter"
version = "0.1.0"
description = "Measure any RAG system: retrieval quality, faithfulness, cost, regressions."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "sqlalchemy>=2",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "respx>=0.21"]
# Reference implementation for cross-checking our metrics, never a runtime
# dependency. Pinned because ragas 0.2 and 0.4 both import
# langchain_community.chat_models.vertexai, which modern langchain-community
# no longer ships; rapidfuzz backs its non-LLM string matching.
ragas = ["ragas>=0.2,<0.3", "langchain-community<0.4", "rapidfuzz"]

[project.scripts]
ragmeter = "ragmeter.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ragmeter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ragas: cross-check against RAGAS (requires the ragas extra)"]
